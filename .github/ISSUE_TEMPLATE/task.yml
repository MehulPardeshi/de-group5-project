name: Task
description: A piece of project work with one owner and a due date
body:
  - type: textarea
    id: what
    attributes:
      label: What needs to be done?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How will we know this is finished?
      value: "- [ ] "
    validations:
      required: true
  - type: input
    id: due
    attributes:
      label: Due date
      placeholder: e.g. Nov 12
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes and links
