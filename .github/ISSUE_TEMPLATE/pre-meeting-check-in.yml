name: Pre-meeting check-in
description: Fill this in before our team meeting
title: "Check-in: "
labels: ["meeting"]
body:
  - type: dropdown
    id: name
    attributes:
      label: Your name
      options:
        - Joshua
        - Mehul
        - Sowmya
        - Yang
    validations:
      required: true
  - type: input
    id: ideas-pr
    attributes:
      label: Link to your ideas PR
      placeholder: https://github.com/MehulPardeshi/de-group5-project/pull/...
    validations:
      required: true
  - type: textarea
    id: interest
    attributes:
      label: Which ideas from the team interest you most, and why?
      description: Read the open ideas PRs first. Your own ideas can count.
    validations:
      required: true
  - type: dropdown
    id: sql
    attributes:
      label: SQL and PostgreSQL
      options:
        - New to it
        - Some experience
        - Confident
    validations:
      required: true
  - type: dropdown
    id: python
    attributes:
      label: Python for data work
      options:
        - New to it
        - Some experience
        - Confident
    validations:
      required: true
  - type: dropdown
    id: cloud
    attributes:
      label: AWS, S3 or MongoDB
      options:
        - New to it
        - Some experience
        - Confident
    validations:
      required: true
  - type: checkboxes
    id: areas
    attributes:
      label: What would you like to work on?
      description: Pick as many as you like.
      options:
        - label: Finding and checking datasets
        - label: Ingestion and storage
        - label: Data quality and cleaning
        - label: Integration, transformation and serving tables
        - label: Analysis and visualization
        - label: Writing, video and presentation
  - type: input
    id: availability
    attributes:
      label: Best times for a weekly online meeting
      placeholder: e.g. Thursdays after 8 pm, Sunday afternoons
    validations:
      required: true
  - type: textarea
    id: conflicts
    attributes:
      label: Dates you're busy or anything blocking you
      description: Include any conflict with Dec 9, 5:30-8:30 pm, when everyone must present in person.
  - type: textarea
    id: agenda
    attributes:
      label: Anything to add to the agenda?
